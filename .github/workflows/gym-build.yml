name: Gym Leader Fire Black CI

on:
  push:
    branches: [ gym-leader-fireblack ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-modern:
    runs-on: ubuntu-latest
    env:
      GAME_VERSION: FIRERED
      GAME_LANGUAGE: FRENCH
      GAME_REVISION: 0
      MODERN: 1
      COMPARE: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev

      - name: Build ROM
        run: make -j2 all

      - name: Find ROM
        id: rom
        shell: bash
        run: |
          ROM="$(find . -maxdepth 1 -name 'poke*.gba' -print -quit)"
          test -n "$ROM"
          echo "rom=$ROM" >> "$GITHUB_OUTPUT"

      - name: Upload ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pokemon-Gym-Leader-FireBlack-test
          path: ${{ steps.rom.outputs.rom }}
          if-no-files-found: error
