name: Gym Leader Fire Black CI

on:
  push:
    branches: [ gym-leader-fireblack ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-modern:
    runs-on: ubuntu-latest
    env:
      GAME_VERSION: FIRERED
      GAME_LANGUAGE: ENGLISH
      GAME_REVISION: 0
      MODERN: 1
      COMPARE: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev

      - name: Validate Fire Black derived roster
        run: |
          python3 tools/fireblack_roster_data/unpack_roster.py --preflight
          python3 tools/fireblack_roster_data/unpack_roster.py --manifest /tmp/fireblack-roster-manifest.json
          python3 tools/fireblack_roster_data/unpack_roster.py /tmp/fireblack-roster-staging.csv
          python3 - <<'PY'
          import csv, json
          from pathlib import Path
          manifest = json.loads(Path("/tmp/fireblack-roster-manifest.json").read_text())
          assert manifest["scanned_rows"] == 411
          assert manifest["preflight"]["stats_and_types_ready"], manifest["preflight"]
          assert {4, 5, 6}.issubset(set(manifest["protected_species_slots"]))
          with Path("/tmp/fireblack-roster-staging.csv").open(newline="", encoding="utf-8") as f:
              slots = {int(row["source_slot"]) for row in csv.DictReader(f)}
          assert not slots.intersection({4, 5, 6})
          PY

      - name: Build ROM
        run: make -j2 all

      - name: Find ROM
        id: rom
        shell: bash
        run: |
          ROM="$(find . -maxdepth 1 -name 'poke*.gba' -print -quit)"
          test -n "$ROM"
          echo "rom=$ROM" >> "$GITHUB_OUTPUT"

      - name: Upload ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pokemon-Gym-Leader-FireBlack-test
          path: ${{ steps.rom.outputs.rom }}
          if-no-files-found: error
